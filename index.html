<!doctype html>
<html lang="en" style="background: #0a0c11">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#0a0c11" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <link rel="icon" href="data:," />
    <title>NIfTI / DICOM volume viewer — Three.js demo</title>
    <!--
      Boot splash, inlined so it paints on the first frame — before any of the
      app's JS chunks download. main.tsx drives #boot-fill / #boot-label as the
      heavy chunks load, then fades #boot out once the app has mounted.
    -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #0a0c11;
        color: #9fb0cc;
        font:
          13px ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        transition: opacity 0.3s ease;
      }
      #boot.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #boot .boot-title {
        color: #cfe0f5;
        font-size: 14px;
        letter-spacing: 0.02em;
      }
      #boot .boot-track {
        width: min(340px, 64vw);
        height: 6px;
        border-radius: 999px;
        background: rgba(120, 160, 220, 0.14);
        overflow: hidden;
      }
      #boot #boot-fill {
        width: 8%;
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, #3a6ea5, #5ea0f0);
        background-size: 200% 100%;
        box-shadow: 0 0 12px rgba(94, 160, 240, 0.6);
        transition: width 0.35s ease;
        animation: boot-flow 1.1s linear infinite;
      }
      /* Keep the fill visibly "working" even while a width step waits on a download. */
      @keyframes boot-flow {
        from {
          background-position: 200% 0;
        }
        to {
          background-position: 0 0;
        }
      }
      #boot #boot-label {
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot">
      <div class="boot-title">NIfTI / DICOM volume viewer</div>
      <div class="boot-track"><div id="boot-fill"></div></div>
      <div id="boot-label">loading…</div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
